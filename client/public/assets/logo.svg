<!-- AI Web3 Club — Circular Avatar (Clipped, no outer black square) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <!-- circle clip -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="512" cy="512" r="512"/>
    </clipPath>

    <!-- top arc -->
    <path id="topArc" d="M 232 512 A 280 280 0 0 1 792 512"/>
    <!-- bottom arc (upright text) -->
    <path id="botArc" d="M 232 512 A 280 280 0 0 0 792 512"/>
  </defs>

  <!-- clipped content -->
  <g clip-path="url(#circleClip)">

    <!-- background (only inside circle) -->
    <rect width="1024" height="1024" fill="#000"/>

    <!-- subtle circular frame -->
    <g fill="none" stroke="#fff" stroke-width="22" opacity="0.95">
      <circle cx="512" cy="512" r="420"/>
      <circle cx="512" cy="512" r="380" opacity="0.6"/>
    </g>

    <!-- AI monogram -->
    <g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <!-- A -->
      <path d="M340 690 L512 300 L684 690"/>
      <path d="M410 560 L614 560"/>
      <!-- I -->
      <path d="M512 340 L512 700"/>
      <!-- nodes -->
      <circle cx="512" cy="300" r="14" fill="#fff"/>
      <circle cx="512" cy="700" r="14" fill="#fff"/>
    </g>

    <!-- circular text -->
    <g fill="#fff">
      <text font-family="Inter, ui-sans-serif, system-ui"
            font-size="40" font-weight="700" letter-spacing="6">
        <textPath href="#topArc" startOffset="50%" text-anchor="middle">
          AI WEB3 CLUB
        </textPath>
      </text>

      <text font-family="Inter, ui-sans-serif, system-ui"
            font-size="26" font-weight="600" letter-spacing="5" opacity="0.85">
        <textPath href="#botArc" startOffset="50%" text-anchor="middle">
          INTERNAL · AI FIRST
        </textPath>
      </text>
    </g>

  </g>
</svg>
